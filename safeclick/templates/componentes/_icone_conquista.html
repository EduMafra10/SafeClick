{# Um ícone por tipo de critério, usado no aviso e no painel. #}
{% macro icone_conquista(criterio) %}
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        {% if criterio == "conteudos_concluidos" %}
            {# livro aberto #}
            <path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2Z" />
            <path d="M12 6.5v13" />
        {% elif criterio == "quizzes_respondidos" %}
            {# lista com marcações #}
            <path d="m4 7 1.5 1.5L8 6" />
            <path d="m4 13 1.5 1.5L8 12" />
            <path d="M11 7.5h9M11 13.5h9M11 19h6" />
        {% elif criterio == "acertos_em_um_quiz" %}
            {# alvo #}
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="4.5" />
            <circle cx="12" cy="12" r="1" />
        {% elif criterio == "quizzes_perfeitos" %}
            {# estrela #}
            <path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z" />
        {% elif criterio == "simulacoes_realizadas" %}
            {# mensagem #}
            <path d="M4 5.5h16v10H9l-5 4v-14Z" />
            <path d="M8 9.5h8M8 12.5h5" />
        {% elif criterio == "escolhas_seguras" %}
            {# escudo com visto #}
            <path d="M12 3.5 19 6v5.5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6Z" />
            <path d="m9 12 2.2 2.2L15.5 10" />
        {% elif criterio == "desafios_senha" %}
            {# chave #}
            <circle cx="8" cy="14" r="4" />
            <path d="m11 11 8.5-8.5M16 6l2.5 2.5M14 8l2 2" />
        {% else %}
            {# troféu #}
            <path d="M8 4.5h8v4a4 4 0 0 1-8 0Z" />
            <path d="M8 6.5H5a3 3 0 0 0 3 3.5M16 6.5h3a3 3 0 0 1-3 3.5M12 12.5v3.5M8.5 19.5h7M10 16h4l.5 3.5h-5Z" />
        {% endif %}
    </svg>
{% endmacro %}
