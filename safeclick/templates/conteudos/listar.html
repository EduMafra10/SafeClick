<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdos educativos | SafeClick</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/conteudos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navegacao.css') }}">
    <script src="{{ url_for('static', filename='js/navegacao.js') }}" defer></script>
</head>
<body class="conteudos-pagina">
    {% include "componentes/cabecalho.html" %}

    <main class="conteudos-container conteudos-conteudo">
        <h1>Conteúdos educativos</h1>
        <p class="conteudos-instrucao">Escolha um tema para começar a leitura.</p>

        {% if not current_user.is_authenticated %}
            <p>
                <a href="{{ url_for('autenticacao.login') }}">Entrar na conta</a>
            </p>
        {% endif %}
        <div class="conteudos-lista">
            {% for c in conteudos %}
                <a class="conteudos-card" href="{{ url_for('conteudos.detalhe', slug=c.slug) }}">
                    <h2>{{ c.titulo }}</h2>
                    <span class="conteudos-card-link">Ler conteúdo →</span>
                </a>
            {% endfor %}
        </div>
    </main>
</body>
</html>
