<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ conteudo.titulo }} | SafeClick</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/conteudos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navegacao.css') }}">
    <script src="{{ url_for('static', filename='js/navegacao.js') }}" defer></script>
</head>
<body class="conteudos-pagina">
    {% include "componentes/cabecalho.html" %}

    <main class="conteudos-container conteudos-conteudo">
        <a class="conteudos-voltar" href="{{ url_for('conteudos.listar') }}">
            Voltar para conteúdos
        </a>

        <article class="conteudos-artigo">
            <h1>{{ conteudo.titulo }}</h1>

            <div class="conteudos-corpo">
                {{ conteudo.texto | safe }}
            </div>
        </article>
    </main>
</body>
</html>
