<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Quizzes | SafeClick{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/quizzes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navegacao.css') }}">
    <script src="{{ url_for('static', filename='js/navegacao.js') }}" defer></script>
</head>
<body class="quizzes-pagina">
    <a class="quizzes-pular" href="#conteudo">Pular para o conteúdo</a>

    {% include "componentes/cabecalho.html" %}

    <main id="conteudo" class="quizzes-container quizzes-conteudo" tabindex="-1">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="quizzes-rodape">
        <div class="quizzes-container">
            SafeClick · Educação para a segurança digital
        </div>
    </footer>
</body>
</html>
