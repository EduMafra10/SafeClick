<nav class="avaliacoes-admin-atalhos" aria-label="Gestão de avaliações">

           {% if request.endpoint == 'administracao.listar_avaliacoes' %}aria-current="page"{% endif %}>{{ icone('avaliacoes') }}Médias e quantidades</a>

    </div>
    <div class="avaliacoes-admin-links">
        <a class="admin-botao-secundario" href="{{ url_for('avaliacoes.publicas') }}">{{ icone('plataforma') }}Ver avaliações públicas</a>
